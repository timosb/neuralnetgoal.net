# /etc/nginx/sites-available/neuralnetgoal-parser   (then: ln -s into sites-enabled, nginx -t, systemctl reload nginx)
#
# This file is plain HTTP on purpose. After it is active, run:   certbot --nginx -d parser.example.com
# certbot then adds the certificate, the 443 listener and the http->https redirect to THIS server block by itself.
# Replace parser.example.com with your real host name first.

server {
    listen 80;
    listen [::]:80;
    server_name parser.example.com;

    # The API listens on localhost only; nginx is the only thing facing the internet.
    location / {
        proxy_pass         http://127.0.0.1:5234;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
    }

    # Live event stream (Server-Sent Events): must NOT be buffered and must be allowed to stay open for a long time.
    location ~ ^/v1/jobs/[^/]+/events$ {
        proxy_pass         http://127.0.0.1:5234;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    # Optional extra protection: only allow your own addresses to call the API (the API key is still required).
    # location /v1/ { allow 83.174.151.68; deny all; ... }   (needs the proxy_pass lines repeated inside)
}
