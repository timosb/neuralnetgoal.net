# /etc/nginx/sites-available/parser-acme
# nginx keeps port 80 for its other sites. This tiny site ONLY answers Let's Encrypt's domain-validation request for the
# parser name, so certbot can issue and renew the certificate that the API itself uses on port 5234 (https).
# It proxies nothing and serves no content.
server {
    listen 80;
    listen [::]:80;
    server_name parser.neuralnetgoal.cloud;

    root /var/www/certbot;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
