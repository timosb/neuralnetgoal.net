# /etc/nginx/sites-available/parser-443        (then: ln -s into sites-enabled, nginx -t, systemctl reload nginx)
#
# Why: web hosts such as SmarterASP.NET only allow outgoing calls to the standard ports (80/443), so the website could not reach
# https://parser.neuralnetgoal.cloud:5234. This adds the same API on the standard HTTPS port 443:
#     https://parser.neuralnetgoal.cloud   ->  nginx (443, Let's Encrypt certificate)  ->  the API on 127.0.0.1:5234 (https)
# Port 5234 keeps working exactly as before. The API key is still required for every call.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name parser.neuralnetgoal.cloud;

    # the certificate certbot already issued for this name (renewed automatically)
    ssl_certificate     /etc/letsencrypt/live/parser.neuralnetgoal.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parser.neuralnetgoal.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass             https://127.0.0.1:5234;   # the API's own HTTPS endpoint on this machine
        proxy_ssl_server_name  on;
        proxy_ssl_name         parser.neuralnetgoal.cloud;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_set_header       Connection        "";
        proxy_read_timeout     300s;
        client_max_body_size   5m;
    }

    # live event stream (Server-Sent Events): no buffering, may stay open for a long time
    location ~ ^/v1/jobs/[^/]+/events$ {
        proxy_pass             https://127.0.0.1:5234;
        proxy_ssl_server_name  on;
        proxy_ssl_name         parser.neuralnetgoal.cloud;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_set_header       Connection        "";
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     1h;
        chunked_transfer_encoding on;
    }
}
