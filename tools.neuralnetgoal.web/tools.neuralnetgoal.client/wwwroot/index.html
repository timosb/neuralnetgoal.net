<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuralNetGoal Tools</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="nng-logo.svg" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="_content/Telerik.UI.for.Blazor/css/kendo-theme-bootstrap/all.css" />
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <div id="app">
        <div class="nng-loading"><img src="nng-logo.svg" alt="NeuralNetGoal" /><div>Loading...</div></div>
    </div>
    <div id="blazor-error-ui">An unhandled error has occurred. <a href="." class="reload">Reload</a></div>

    <script src="_content/Telerik.UI.for.Blazor/js/telerik-blazor.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        // The Blazor app is ~110 small files. Fetched all at once, the hosting firewall answers some with 403 and the app
        // never starts. So fetch them a few at a time and retry a refused one.
        (function () {
            const MAX = 6; let active = 0; const waiting = [];
            const acquire = () => new Promise(res => { if (active < MAX) { active++; res(); } else waiting.push(res); });
            const release = () => { const next = waiting.shift(); if (next) next(); else active--; };
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            async function load(uri, integrity) {
                await acquire();
                try {
                    for (let attempt = 0; ; attempt++) {
                        try {
                            const r = await fetch(uri, { cache: 'no-cache', integrity: integrity || undefined, credentials: 'same-origin' });
                            if (r.ok || attempt >= 6) return r;
                        } catch (e) { if (attempt >= 6) throw e; }
                        await sleep(300 * (attempt + 1));
                    }
                } finally { release(); }
            }
            Blazor.start({
                loadBootResource: function (type, name, defaultUri, integrity) {
                    if (type === 'dotnetjs' || type === 'configuration' || type === 'manifest') return undefined;
                    return load(defaultUri, integrity);
                }
            });
        })();
    </script>
    <script>
        // downloads the Excel file with the cookie of the signed-in user
        window.nngDownload = (url, fileName) => {
            const a = document.createElement('a');
            a.href = url; a.download = fileName || ''; document.body.appendChild(a); a.click(); a.remove();
        };
        window.nngScrollToEnd = (id) => { const e = document.getElementById(id); if (e) e.scrollTop = e.scrollHeight; };
    </script>
</body>
</html>
